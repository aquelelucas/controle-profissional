<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste API</title>
</head>

<body>

  <h1>Teste do Controle Profissional</h1>

  <p id="status">
    Consultando API...
  </p>

  <select id="separadores">
    <option>Carregando...</option>
  </select>

  <script>

    const API =
      "https://script.google.com/macros/s/AKfycbxfauuaqd7saDP7Brp3T7ES4R-ZQA7rR1dmzjFc6Xz6ynBIjaB_D1hsuQolmJ92jQINSw/exec";

    const CHAVE =
      "KING-CONFERENCIA-2026";


    const callback =
      "testeAPI_" + Date.now();


    window[callback] =
      function(resposta) {

        console.log(
          "RESPOSTA DA API:",
          resposta
        );


        const status =
          document.getElementById("status");


        const select =
          document.getElementById("separadores");


        if (
          !resposta ||
          resposta.sucesso !== true
        ) {

          status.textContent =
            "ERRO: " +
            (
              resposta &&
              resposta.erro
                ? resposta.erro
                : "Resposta inválida"
            );

          return;
        }


        status.textContent =
          "API funcionando. Separadores encontrados: " +
          resposta.separadores.length;


        select.innerHTML = "";


        resposta.separadores.forEach(
          function(nome) {

            const option =
              document.createElement("option");

            option.value =
              nome;

            option.textContent =
              nome;

            select.appendChild(
              option
            );

          }
        );

      };


    const url =
      API +
      "?acao=separadores" +
      "&chave=" +
      encodeURIComponent(CHAVE) +
      "&callback=" +
      callback;


    console.log(
      "URL chamada:",
      url
    );


    const script =
      document.createElement("script");


    script.src =
      url;


    script.onerror =
      function() {

        document.getElementById(
          "status"
        ).textContent =
          "ERRO: o navegador não conseguiu carregar a resposta da API.";

      };


    document.body.appendChild(
      script
    );

  </script>

</body>
</html>
