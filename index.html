<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>King - Conferência</title>

  <!-- Leitor de código de barras -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f2f4f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #111;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-top: 4px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .btn-iniciar {
      background: #1976d2;
      color: white;
    }

    .btn-parar {
      background: #c62828;
      color: white;
    }

    .contador {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    .numero {
      color: #1976d2;
      font-size: 30px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      margin-top: 10px;
      min-height: 100px;
    }

    #reader video {
      border-radius: 12px;
    }

    .instrucao {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin: 10px 0;
    }

    .status {
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 17px;
    }

    .sucesso {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .erro {
      background: #ffebee;
      color: #c62828;
    }

    .ultimo {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #f1f8ff;
      text-align: center;
    }

    .ultimo-label {
      color: #666;
      font-size: 14px;
    }

    .ultimo-pedido {
      color: #1976d2;
      font-size: 32px;
      font-weight: bold;
      margin-top: 5px;
    }

    /* =========================
       CONFIRMAÇÃO DO PEDIDO
       ========================= */

    .confirmacao {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.60);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .confirmacao-card {
      width: 100%;
      max-width: 390px;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.30);
      text-align: center;
    }

    .confirmacao-titulo {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .confirmacao-texto {
      color: #666;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .pedido-confirmacao {
      color: #1976d2;
      font-size: 36px;
      font-weight: bold;
      margin: 10px 0 22px;
      word-break: break-all;
    }

    .botoes-confirmacao {
      display: flex;
      gap: 10px;
    }

    .botoes-confirmacao button {
      width: 50%;
      margin-top: 0;
    }

    .btn-sim {
      background: #2e7d32;
      color: white;
    }

    .btn-nao {
      background: #c62828;
      color: white;
    }

    .oculto {
      display: none !important;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <div class="logo">
      KING
    </div>

    <div class="subtitulo">
      Controle de Conferência
    </div>


    <!-- ========================= -->
    <!-- TELA INICIAL              -->
    <!-- ========================= -->

    <div id="telaInicial">

      <label for="separador">
        Separador
      </label>

      <select id="separador">

        <option value="">
          Carregando...
        </option>

      </select>


      <button
        class="btn-iniciar"
        onclick="iniciarConferencia()"
      >
        INICIAR CONFERÊNCIA
      </button>

    </div>


    <!-- ========================= -->
    <!-- TELA DE CONFERÊNCIA       -->
    <!-- ========================= -->

    <div
      id="telaConferencia"
      class="oculto"
    >

      <div class="contador">

        Pedidos hoje:

        <span
          id="contador"
          class="numero"
        >
          0
        </span>

      </div>


      <!-- CÂMERA -->

      <div id="reader"></div>


      <div class="instrucao">

        Aponte a câmera para o código
        de barras do pedido.

        <br><br>

        Após a leitura, confirme o número.

      </div>


      <!-- STATUS -->

      <div
        id="status"
        class="status oculto"
      ></div>


      <!-- ÚLTIMO PEDIDO -->

      <div
        id="ultimo"
        class="ultimo oculto"
      >

        <div class="ultimo-label">
          Último pedido registrado
        </div>

        <div
          id="ultimoPedido"
          class="ultimo-pedido"
        >
        </div>

      </div>


      <button
        class="btn-parar"
        onclick="finalizarConferencia()"
      >
        FINALIZAR CONFERÊNCIA
      </button>

    </div>

  </div>

</div>


<!-- ========================= -->
<!-- CONFIRMAÇÃO DO PEDIDO     -->
<!-- ========================= -->

<div
  id="confirmacao"
  class="confirmacao oculto"
>

  <div class="confirmacao-card">

    <div class="confirmacao-titulo">
      Confirmar pedido?
    </div>

    <div class="confirmacao-texto">
      A câmera leu o seguinte número:
    </div>

    <div
      id="pedidoConfirmacao"
      class="pedido-confirmacao"
    >
    </div>

    <div class="botoes-confirmacao">

      <button
        id="btnNao"
        class="btn-nao"
        onclick="recusarPedido()"
      >
        NÃO
      </button>

      <button
        id="btnSim"
        class="btn-sim"
        onclick="confirmarPedido()"
      >
        SIM
      </button>

    </div>

  </div>

</div>


<script>


/* =====================================================
   CONFIGURAÇÃO
   ===================================================== */

const URL_API =
  'https://script.google.com/macros/s/AKfycbxfauuaqd7saDP7Brp3T7ES4R-ZQA7rR1dmzjFc6Xz6ynBIjaB_D1hsuQolmJ92jQINSw/exec';


const CHAVE =
  'KING-CONFERENCIA-2026';


/* =====================================================
   VARIÁVEIS
   ===================================================== */

let separador = '';

let scanner = null;

let processando = false;

let pedidoPendente = '';

let ultimoCodigo = '';

let ultimoMomento = 0;


/* =====================================================
   CONTADOR LOCAL
   ===================================================== */

function chaveContador() {

  const hoje =
    new Date()
      .toISOString()
      .substring(0, 10);

  return (
    'contador_' +
    hoje +
    '_' +
    separador
  );

}


function obterContadorLocal() {

  return parseInt(
    localStorage.getItem(
      chaveContador()
    ) || '0',
    10
  );

}


function salvarContadorLocal(valor) {

  localStorage.setItem(
    chaveContador(),
    String(valor)
  );

}


function atualizarTelaContador() {

  document
    .getElementById('contador')
    .textContent =
    obterContadorLocal();

}


/* =====================================================
   CARREGAR SEPARADORES
   ===================================================== */

function carregarSeparadores() {

  const callback =
    'callbackSeparadores_' +
    Date.now();


  window[callback] =
    function(dados) {

      try {

        if (
          !dados ||
          !dados.sucesso
        ) {

          throw new Error(
            dados &&
            dados.erro
              ? dados.erro
              : 'Erro ao carregar os separadores.'
          );

        }


        const select =
          document.getElementById(
            'separador'
          );


        select.innerHTML =
          '<option value="">Selecione seu nome</option>';


        (dados.separadores || [])
          .forEach(
            function(nome) {

              const option =
                document.createElement(
                  'option'
                );

              option.value =
                nome;

              option.textContent =
                nome;

              select.appendChild(
                option
              );

            }
          );


        if (
          !dados.separadores ||
          dados.separadores.length === 0
        ) {

          mostrarStatus(
            'Nenhum separador foi encontrado na aba Cadastro.',
            true
          );

        }

      } catch (erro) {

        mostrarStatus(
          erro.message,
          true
        );

      }


      removerScript(
        callback
      );

    };


  const script =
    document.createElement(
      'script'
    );


  script.src =
    URL_API +
    '?acao=separadores' +
    '&chave=' +
    encodeURIComponent(
      CHAVE
    ) +
    '&callback=' +
    callback;


  script.onerror =
    function() {

      mostrarStatus(
        'Não foi possível carregar os separadores.',
        true
      );

      removerScript(
        callback
      );

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   REMOVER SCRIPT JSONP
   ===================================================== */

function removerScript(
  nomeCallback
) {

  document
    .querySelectorAll(
      'script'
    )
    .forEach(
      function(script) {

        if (
          script.src &&
          script.src.includes(
            nomeCallback
          )
        ) {

          script.remove();

        }

      }
    );


  try {

    delete window[
      nomeCallback
    ];

  } catch (e) {}

}


/* =====================================================
   INICIALIZAÇÃO
   ===================================================== */

carregarSeparadores();


/* =====================================================
   INICIAR CONFERÊNCIA
   ===================================================== */

function iniciarConferencia() {

  const select =
    document.getElementById(
      'separador'
    );


  if (!select.value) {

    alert(
      'Selecione o separador.'
    );

    return;

  }


  separador =
    select.value;


  atualizarTelaContador();


  document
    .getElementById(
      'telaInicial'
    )
    .classList.add(
      'oculto'
    );


  document
    .getElementById(
      'telaConferencia'
    )
    .classList.remove(
      'oculto'
    );


  iniciarCamera();

}


/* =====================================================
   CÂMERA
   ===================================================== */

function iniciarCamera() {

  if (
    typeof Html5Qrcode ===
    'undefined'
  ) {

    mostrarStatus(
      'O leitor de código de barras não foi carregado. Verifique a conexão com a internet.',
      true
    );

    return;

  }


  if (scanner) {

    return;

  }


  scanner =
    new Html5Qrcode(
      'reader'
    );


  const formatos = [

    Html5QrcodeSupportedFormats.CODE_128,

    Html5QrcodeSupportedFormats.CODE_39,

    Html5QrcodeSupportedFormats.CODE_93,

    Html5QrcodeSupportedFormats.EAN_13,

    Html5QrcodeSupportedFormats.EAN_8,

    Html5QrcodeSupportedFormats.UPC_A,

    Html5QrcodeSupportedFormats.UPC_E

  ];


  const configuracao = {

    fps: 10,

    formatsToSupport:
      formatos,

    qrbox:
      function(
        largura,
        altura
      ) {

        const tamanho =
          Math.min(
            largura * 0.85,
            350
          );


        return {

          width:
            tamanho,

          height:
            Math.min(
              tamanho * 0.45,
              altura * 0.7
            )

        };

      }

  };


  scanner.start(

    {
      facingMode:
        'environment'
    },

    configuracao,

    quandoCodigoForLido,

    function() {

      /*
       * Tentativas sem encontrar
       * código são ignoradas.
       */

    }

  )

  .then(
    function() {

      mostrarStatus(
        'Câmera pronta. Aponte para o código de barras.',
        false
      );

    }
  )

  .catch(
    function(erro) {

      mostrarStatus(
        'Não foi possível abrir a câmera. Verifique a permissão de câmera do navegador.',
        true
      );

      console.error(
        erro
      );

    }
  );

}


/* =====================================================
   CÓDIGO FOI LIDO
   ===================================================== */

function quandoCodigoForLido(
  codigo
) {

  codigo =
    String(
      codigo || ''
    ).trim();


  if (!codigo) {

    return;

  }


  /*
   * Se já existe um pedido esperando
   * confirmação, ignoramos qualquer
   * outra leitura.
   */

  if (
    pedidoPendente ||
    processando
  ) {

    return;

  }


  /*
   * Proteção contra a câmera ler
   * repetidamente o mesmo código.
   */

  const agora =
    Date.now();


  if (

    codigo === ultimoCodigo &&

    agora -
    ultimoMomento <
    5000

  ) {

    return;

  }


  ultimoCodigo =
    codigo;


  ultimoMomento =
    agora;


  /*
   * Guarda o pedido, mas NÃO grava
   * ainda na planilha.
   */

  pedidoPendente =
    codigo;


  /*
   * Mostra a confirmação.
   */

  document
    .getElementById(
      'pedidoConfirmacao'
    )
    .textContent =
    codigo;


  document
    .getElementById(
      'confirmacao'
    )
    .classList.remove(
      'oculto'
    );


  mostrarStatus(
    'Confirme o número do pedido.',
    false
  );

}


/* =====================================================
   SIM
   ===================================================== */

function confirmarPedido() {

  if (
    !pedidoPendente ||
    processando
  ) {

    return;

  }


  const pedido =
    pedidoPendente;


  fecharConfirmacao();


  registrarPedido(
    pedido
  );

}


/* =====================================================
   NÃO
   ===================================================== */

function recusarPedido() {

  pedidoPendente =
    '';


  fecharConfirmacao();


  /*
   * Mantém o mesmo código bloqueado
   * por alguns segundos para evitar que
   * a câmera abra a confirmação novamente
   * imediatamente.
   */

  ultimoMomento =
    Date.now();


  mostrarStatus(
    'Leitura descartada. A câmera está pronta para o próximo pedido.',
    false
  );

}


/* =====================================================
   FECHAR CONFIRMAÇÃO
   ===================================================== */

function fecharConfirmacao() {

  document
    .getElementById(
      'confirmacao'
    )
    .classList.add(
      'oculto'
    );


  document
    .getElementById(
      'pedidoConfirmacao'
    )
    .textContent =
    '';

}


/* =====================================================
   REGISTRAR PEDIDO
   ===================================================== */

function registrarPedido(
  pedido
) {

  if (processando) {

    return;

  }


  processando =
    true;


  document
    .getElementById(
      'btnSim'
    )
    .disabled =
    true;


  document
    .getElementById(
      'btnNao'
    )
    .disabled =
    true;


  mostrarStatus(
    'Registrando pedido ' +
    pedido +
    '...',
    false
  );


  const callback =
    'callbackRegistro_' +
    Date.now();


  window[callback] =
    function(dados) {

      try {

        if (
          !dados ||
          !dados.sucesso
        ) {

          throw new Error(
            dados &&
            dados.erro
              ? dados.erro
              : 'Não foi possível registrar o pedido.'
          );

        }


        /*
         * O Apps Script atual grava:
         *
         * A = Data
         * B = Turno
         * C = Pedido
         * D = Separador
         *
         * E:L permanecem intocadas.
         */

        adicionarAoContador();


        document
          .getElementById(
            'ultimo'
          )
          .classList.remove(
            'oculto'
          );


        document
          .getElementById(
            'ultimoPedido'
          )
          .textContent =
          dados.pedido;


        mostrarStatus(
          '✓ Pedido ' +
          dados.pedido +
          ' registrado!',
          false
        );


        /*
         * Limpa a leitura pendente
         * e mantém a câmera ligada.
         */

        pedidoPendente =
          '';


        ultimoCodigo =
          dados.pedido;


        ultimoMomento =
          Date.now();


      } catch (erro) {

        mostrarStatus(
          erro.message,
          true
        );

      }


      processando =
        false;


      document
        .getElementById(
          'btnSim'
        )
        .disabled =
        false;


      document
        .getElementById(
          'btnNao'
        )
        .disabled =
        false;


      removerScript(
        callback
      );

    };


  /*
   * IMPORTANTE:
   *
   * Não enviamos conferente.
   *
   * Enviamos somente:
   * pedido
   * separador
   */

  const script =
    document.createElement(
      'script'
    );


  script.src =

    URL_API +

    '?acao=registrar' +

    '&chave=' +
    encodeURIComponent(
      CHAVE
    ) +

    '&pedido=' +
    encodeURIComponent(
      pedido
    ) +

    '&separador=' +
    encodeURIComponent(
      separador
    ) +

    '&callback=' +
    callback;


  script.onerror =
    function() {

      processando =
        false;


      document
        .getElementById(
          'btnSim'
        )
        .disabled =
        false;


      document
        .getElementById(
          'btnNao'
        )
        .disabled =
        false;


      mostrarStatus(
        'Erro de comunicação com o Google Sheets.',
        true
      );


      removerScript(
        callback
      );

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   CONTADOR
   ===================================================== */

function adicionarAoContador() {

  const atual =
    obterContadorLocal();


  const novo =
    atual + 1;


  salvarContadorLocal(
    novo
  );


  document
    .getElementById(
      'contador'
    )
    .textContent =
    novo;

}


/* =====================================================
   FINALIZAR
   ===================================================== */

function finalizarConferencia() {

  if (
    pedidoPendente
  ) {

    alert(
      'Confirme ou descarte o pedido que está aguardando antes de finalizar.'
    );

    return;

  }


  if (
    !confirm(
      'Deseja finalizar esta conferência?'
    )
  ) {

    return;

  }


  if (scanner) {

    scanner
      .stop()
      .then(
        function() {

          scanner.clear();

          scanner =
            null;

          voltarInicio();

        }
      )
      .catch(
        function() {

          scanner =
            null;

          voltarInicio();

        }
      );

  } else {

    voltarInicio();

  }

}


/* =====================================================
   VOLTAR PARA INÍCIO
   ===================================================== */

function voltarInicio() {

  document
    .getElementById(
      'telaConferencia'
    )
    .classList.add(
      'oculto'
    );


  document
    .getElementById(
      'telaInicial'
    )
    .classList.remove(
      'oculto'
    );


  document
    .getElementById(
      'reader'
    )
    .innerHTML =
    '';


  document
    .getElementById(
      'status'
    )
    .classList.add(
      'oculto'
    );


  document
    .getElementById(
      'ultimo'
    )
    .classList.add(
      'oculto'
    );


  fecharConfirmacao();


  scanner =
    null;


  separador =
    '';


  pedidoPendente =
    '';


  ultimoCodigo =
    '';


  ultimoMomento =
    0;


  processando =
    false;

}


/* =====================================================
   MENSAGENS
   ===================================================== */

function mostrarStatus(
  mensagem,
  erro
) {

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    mensagem;


  status.classList.remove(
    'oculto',
    'erro',
    'sucesso'
  );


  if (erro) {

    status.classList.add(
      'erro'
    );

  } else {

    status.classList.add(
      'sucesso'
    );

  }

}

</script>

</body>

</html>
